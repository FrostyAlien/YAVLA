schema: spec-driven

context: |
  Domain: Vision-Language-Action (VLA) model for robotic manipulation

  Tech stack:
    - Python >=3.12,<3.14; PyTorch >=2.7.1,<2.8; CUDA 12.8 (via cu128 wheels on Linux)
    - HuggingFace transformers, PEFT (LoRA), accelerate
    - Flash Attention 2, DeepSpeed for distributed training (Linux only)
    - LeRobot dataset format + RLDS/Open X-Embodiment compatibility (installed from git, pinned rev)

  Key libraries:
    - torch, torchvision, torchcodec (video decoding; pulls ffmpeg as transitive dep)
    - lerobot (robotics datasets and tools, from git to bypass PyPI torch version cap)
    - transformers, peft, accelerate, flash-attn (Linux), deepspeed (Linux)
    - einops, safetensors
    - wandb (experiment tracking)
    - datasets (HuggingFace — dataset loading, including LeRobot-format data)
    - tyro (config management — typed CLI + YAML)
    - fiftyone (dataset visualization)
    - numpy, scipy, rich, tqdm

  Toolchain:
    - pixi (package manager, pyproject.toml, lockfile, it also integrates uv)
    - voxel51/fiftyone (visualize datasets)

  Evaluation:
    - LIBERO benchmark suite
    - SimplerEnv (sim evaluation)

  MCP servers available:
    - context7: library documentation lookup
    - codex: GPT-5.3-codex model for code generation/analysis and peer review
    - kindly-web-search: web search + page scraping
    - pdf-reader: PDF text/table extraction (useful for reading papers)

  Conventions:
    - Conventional commits (feat:, fix:, docs:, refactor:, test:, chore:)
    - Type hints on all public APIs
    - Google-style docstrings
    - src layout: src/yavla/
    - Config-driven training (YAML configs + CLI overrides via tyro)
    - Reproducible experiments (seed everything, log all hyperparams to wandb)

